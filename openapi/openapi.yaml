openapi: 3.1.0
info:
  title: PiPGM API
  version: 1.0.0
  description: PiPGM pipelines, library items and stage page, split from pimatrix. Canva routes come in 1.1.
servers:
  - url: http://127.0.0.1:3200
tags:
  - name: System
  - name: Pipelines
  - name: Items
  - name: Library
paths:
  /health:
    get:
      operationId: getHealth
      tags: [System]
      responses:
        "200":
          description: Process is running
  /pipgm/{pipelineId}/stage:
    get:
      operationId: getStagePage
      tags: [Pipelines]
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      responses:
        "200":
          description: Stage page (HTML)
          content:
            text/html:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/pipgm/pipelines:
    get:
      operationId: listPipelines
      tags: [Pipelines]
      parameters:
        - in: query
          name: includeHidden
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: All pipelines
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Pipeline"
  /api/v1/pipgm/pipelines/{pipelineId}:
    get:
      operationId: getPipeline
      tags: [Pipelines]
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      responses:
        "200":
          description: Pipeline snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pipeline"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/pipgm/pipelines/{pipelineId}/frame.png:
    get:
      operationId: getPipelineFrame
      tags: [Pipelines]
      description: >
        The current stage of the pipeline as a PNG, rendered by a headless browser from the stage page.
        Size defaults to the pipeline resolution (1080x1920 portrait, 1920x1080 landscape). With alpha=1
        the stage background is left out, so the picture keeps alpha (text and media stay opaque).
        A fade to black is not applied here: read fadeToBlack from the pipeline. Reads stay open.
      parameters:
        - $ref: "#/components/parameters/PipelineId"
        - in: query
          name: width
          required: false
          schema:
            type: integer
            minimum: 16
            maximum: 3840
        - in: query
          name: height
          required: false
          schema:
            type: integer
            minimum: 16
            maximum: 3840
        - in: query
          name: alpha
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The stage as a PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
        "503":
          description: No browser for the frame route (set PIPGM_CHROMIUM); the renderer keeps one headless Chromium running between renders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The browser failed to render the frame
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/pipgm/pipelines/{pipelineId}/config:
    put:
      operationId: updatePipelineConfig
      tags: [Pipelines]
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orientation:
                  type: string
                  enum: [landscape, portrait]
                hidden:
                  type: boolean
                linked:
                  type: boolean
                fadeDurationMs:
                  type: number
                  minimum: 0
                  maximum: 10000
                keyColor:
                  type: string
                  nullable: true
                  pattern: "^#[0-9a-fA-F]{6}$"
                  description: Chroma key colour for ATEM feeds. The stage background and transparent areas of the content are filled with it. null = normal background (projectors). Persisted.
      responses:
        "200":
          description: Updated pipeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pipeline"
        "422":
          $ref: "#/components/responses/Invalid"
  /api/v1/pipgm/pipelines/{pipelineId}/control:
    post:
      operationId: controlPipeline
      tags: [Pipelines]
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [next, prev, gotoStep, gotoItem, play, pause, stop, restart]
                stepIndex:
                  type: integer
                  minimum: 0
                itemId:
                  type: string
                entryId:
                  type: string
                  description: A playlist entry (the same item can be listed twice); wins over itemId.
                itemIndex:
                  type: integer
                  minimum: 0
                advanceItemOnEnd:
                  type: boolean
                sync:
                  type: boolean
      responses:
        "200":
          description: Pipeline after the action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pipeline"
        "422":
          $ref: "#/components/responses/Invalid"
  /api/v1/pipgm/pipelines/{pipelineId}/ftb:
    post:
      operationId: setFadeToBlack
      tags: [Pipelines]
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fadeToBlack:
                  type: boolean
                toggle:
                  type: boolean
                durationMs:
                  type: number
                  minimum: 0
                  maximum: 10000
                sync:
                  type: boolean
      responses:
        "200":
          description: Pipeline after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pipeline"
  /api/v1/pipgm/pipelines/{pipelineId}/audio:
    post:
      operationId: setPipelineAudio
      tags: [Pipelines]
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                audioEnabled:
                  type: boolean
                toggle:
                  type: boolean
                volume:
                  type: number
                  minimum: 0
                  maximum: 100
                  description: Requested volume; the stage plays at most maxVolume (PIPGM_AUDIO_MAX_VOLUME)
                level:
                  type: string
                  enum: [whisper, normal, loud, shout]
                  description: >
                    A named loudness instead of volume (not both). The numbers behind the names come from
                    PIPGM_AUDIO_LEVELS (see GET /api/v1/pipgm/audio/levels) and are still capped by PIPGM_AUDIO_MAX_VOLUME.
                armSeconds:
                  type: number
                  minimum: 1
                  maximum: 3600
                  description: >
                    How long sound stays armed when audioEnabled turns on or toggles on
                    (default PIPGM_AUDIO_ARM_SECONDS, 900). When it ends, sound is disarmed and the track stops.
                sync:
                  type: boolean
      responses:
        "200":
          description: Pipeline after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pipeline"
  /api/v1/pipgm/pipelines/{pipelineId}/audio/play:
    post:
      operationId: playPipelineAudio
      tags: [Pipelines]
      description: Play an audio library item as the feed's audio content (separate from its visual). Needs sound armed.
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId]
              properties:
                itemId:
                  type: string
                loop:
                  type: boolean
                volume:
                  type: number
                  minimum: 0
                  maximum: 100
                level:
                  type: string
                  enum: [whisper, normal, loud, shout]
                  description: >
                    A named loudness instead of volume (not both). The numbers behind the names come from
                    PIPGM_AUDIO_LEVELS (see GET /api/v1/pipgm/audio/levels) and are still capped by PIPGM_AUDIO_MAX_VOLUME.
      responses:
        "200":
          description: Pipeline after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pipeline"
        "404":
          description: Unknown pipeline or item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Sound is not armed (error code AUDIO_NOT_ARMED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Invalid"
  /api/v1/pipgm/pipelines/{pipelineId}/audio/stop:
    post:
      operationId: stopPipelineAudio
      tags: [Pipelines]
      description: Stop the feed's audio track. The feed stays armed.
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      responses:
        "200":
          description: Pipeline after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pipeline"
  /api/v1/pipgm/feeders:
    get:
      operationId: getFeeders
      tags: [Pipelines]
      description: >
        State of the feed publishers. When PIPGM_PUBLISH_RTSP_BASE is set, piprogram itself publishes PiPGM1-3 to
        MediaMTX (one long-running ffmpeg per feed, stream name = pipeline id) and swaps pictures without restarting it.
        `enabled` is false when publishing is off.
      responses:
        "200":
          description: Publisher state per feed
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  encoder:
                    type: string
                    enum: [libx264, h264_v4l2m2m]
                    description: Encoder in use now (PIPGM_PUBLISH_ENCODER, auto resolves at start).
                  fallback:
                    type: boolean
                    description: True when h264_v4l2m2m failed early and libx264 took over for this process.
                  idleStopSeconds:
                    type: integer
                    description: PIPGM_FEED_IDLE_STOP_SECONDS; 0 = idle stop off.
                  feeds:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        state:
                          type: string
                          enum: [running, idle-stopped, stopped]
                          description: idle-stopped = ffmpeg stopped because the pipeline had no slide for the idle time.
                        running:
                          type: boolean
                        width:
                          type: integer
                          nullable: true
                        height:
                          type: integer
                          nullable: true
                        restarts:
                          type: integer
                        lastError:
                          type: string
                          nullable: true
  /api/v1/pipgm/audio/levels:
    get:
      operationId: getAudioLevels
      tags: [Pipelines]
      description: The volume (0-100) behind each level name, and the gain cap that applies to all of them.
      responses:
        "200":
          description: Levels
          content:
            application/json:
              schema:
                type: object
                properties:
                  levels:
                    type: object
                    properties:
                      whisper: {type: number}
                      normal: {type: number}
                      loud: {type: number}
                      shout: {type: number}
                  maxVolume:
                    type: number
  /api/v1/pipgm/audio/kill:
    post:
      operationId: killAudio
      tags: [Pipelines]
      description: >
        Kill switch. On every pipeline: stop the audio track, disarm and mute (video items go silent too).
        Needs the API key like any write.
      responses:
        "200":
          description: All pipelines after the kill
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Pipeline"
  /api/v1/pipgm/tts/prepare:
    post:
      operationId: prepareSpeech
      tags: [Items]
      description: >
        Render a phrase to a WAV ahead of time and keep it as an audio library item; play it later with
        audio/play. The same text and voice return the same item (200, cached) without rendering again.
        Limits: PIPGM_TTS_MAX_CHARS (500), PIPGM_TTS_MAX_SECONDS (60), PIPGM_AUDIO_MAX_BYTES (20 MB), and the
        oldest prepared phrases are dropped beyond PIPGM_TTS_MAX_ITEMS (50) / PIPGM_TTS_MAX_TOTAL_BYTES (100 MB).
        Phrases are cached on disk (PIPGM_CACHE_DIR) and survive restarts. One render runs at a time. 503 TTS_NOT_CONFIGURED until Piper is set up (PIPGM_TTS_MODEL_DIR).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                voice:
                  type: string
                  description: Voice name, a model file in PIPGM_TTS_MODEL_DIR without extension (default PIPGM_TTS_VOICE)
                title:
                  type: string
      responses:
        "200":
          description: Already prepared
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    $ref: "#/components/schemas/Item"
                  cached:
                    type: boolean
        "201":
          description: Prepared now
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    $ref: "#/components/schemas/Item"
                  cached:
                    type: boolean
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          description: Too many phrases waiting (TTS_BUSY)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The engine failed or returned no usable WAV (TTS_FAILED, TTS_BAD_AUDIO)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Text to speech is not set up (TTS_NOT_CONFIGURED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/pipgm/pipelines/{pipelineId}/basic-image:
    put:
      operationId: setPipelineBasicImage
      tags: [Pipelines]
      description: Choose an image library item to show when nothing else is active (null clears it; the default is black).
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId]
              properties:
                itemId:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Pipeline after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pipeline"
        "404":
          description: Unknown pipeline or item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Invalid"
  /api/v1/pipgm/pipelines/{pipelineId}/playlist:
    post:
      operationId: addPlaylistItem
      tags: [Pipelines]
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId]
              properties:
                itemId:
                  type: string
                cueImmediately:
                  type: boolean
      responses:
        "200":
          description: Pipeline with the item added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pipeline"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/pipgm/pipelines/{pipelineId}/playlist/order:
    put:
      operationId: setPlaylistOrder
      tags: [Pipelines]
      summary: Replace or reorder the playlist atomically
      description: >
        `itemIds` becomes the whole playlist in that order. Items left out are removed, new ones added.
        The active item keeps its place when it is still in the list. 422 when an id is not in the
        library or is listed twice; nothing changes then.
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemIds]
              properties:
                itemIds:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Pipeline with the new playlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pipeline"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
  /api/v1/pipgm/pipelines/{pipelineId}/playlist/steps:
    get:
      operationId: listPlaylistSteps
      tags: [Pipelines]
      summary: The playlist flattened to one ordered list of steps, with thumbnails where prepared
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      responses:
        "200":
          description: Steps of every playlist item in order
          content:
            application/json:
              schema:
                type: object
                required: [pipelineId, orientation, activeItemId, currentStep, steps]
                properties:
                  pipelineId:
                    type: string
                  orientation:
                    type: string
                  activeItemId:
                    type: string
                    nullable: true
                  activeEntryId:
                    type: string
                    nullable: true
                  currentStep:
                    type: integer
                  steps:
                    type: array
                    items:
                      type: object
                      required: [itemId, itemIndex, itemTitle, itemKind, stepIndex, label, thumbnailUrl, isActive]
                      properties:
                        itemId:
                          type: string
                        entryId:
                          type: string
                          nullable: true
                        itemIndex:
                          type: integer
                        itemTitle:
                          type: string
                        itemKind:
                          type: string
                        stepIndex:
                          type: integer
                        label:
                          type: string
                        thumbnailUrl:
                          type: string
                          nullable: true
                        isActive:
                          type: boolean
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/pipgm/pipelines/{pipelineId}/playlist/{itemId}:
    delete:
      operationId: removePlaylistItem
      tags: [Pipelines]
      parameters:
        - $ref: "#/components/parameters/PipelineId"
        - in: path
          name: itemId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pipeline with the item removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pipeline"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/pipgm/playlists:
    get:
      operationId: listSavedPlaylists
      tags: [Playlists]
      summary: Saved playlists, newest first
      responses:
        "200":
          description: Summaries
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlaylistSummary"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
    post:
      operationId: createSavedPlaylist
      tags: [Playlists]
      summary: Save a new playlist (piprogram.playlist/1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaylistInput"
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedPlaylist"
        "422":
          $ref: "#/components/responses/Invalid"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
  /api/v1/pipgm/playlists/generate:
    post:
      operationId: generatePlaylistDraft
      tags: [Playlists]
      summary: A draft playlist for a day from the items' useAt dates
      description: >
        Items whose `useAt` overlaps the day, ordered hymns, slide decks, Canva, images, video and anything else
        (audio is left out), then by time of day and age. Nothing is saved or loaded: the draft has the shape of
        a playlist document and can be edited, saved (POST /playlists) or loaded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date:
                  type: string
                  example: "2026-11-22"
                name:
                  type: string
                orientation:
                  type: string
                  enum: [landscape, portrait]
      responses:
        "200":
          description: The draft
          content:
            application/json:
              schema:
                type: object
                required: [date, draft]
                properties:
                  date:
                    type: string
                  draft:
                    $ref: "#/components/schemas/PlaylistInput"
        "422":
          $ref: "#/components/responses/Invalid"
  /api/v1/pipgm/playlists/{playlistId}:
    parameters:
      - in: path
        name: playlistId
        required: true
        schema:
          type: string
    get:
      operationId: getSavedPlaylist
      tags: [Playlists]
      responses:
        "200":
          description: The playlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedPlaylist"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
    put:
      operationId: replaceSavedPlaylist
      tags: [Playlists]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaylistInput"
      responses:
        "200":
          description: Replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedPlaylist"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
    delete:
      operationId: deleteSavedPlaylist
      tags: [Playlists]
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
  /api/v1/pipgm/pipelines/{pipelineId}/playlist/load:
    post:
      operationId: loadSavedPlaylist
      tags: [Playlists]
      summary: Put a saved playlist on a feed without touching what is on air
      description: >
        `replace` (default) makes the saved playlist the whole playlist, `append` adds the items that are not
        there yet. The active item and its step never change: when the new list does not hold the item on air it
        is carried first in the list until the feed moves on. Nothing is cued when nothing was active. Entries
        are matched by id, else by kind and title, else (hymns) by number. Entries that match nothing are listed
        in `report.missing`; with `strict` any of them answers 409 and nothing changes.
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [playlistId]
              properties:
                playlistId:
                  type: string
                mode:
                  type: string
                  enum: [replace, append]
                strict:
                  type: boolean
      responses:
        "200":
          description: The pipeline and a report of what was found
          content:
            application/json:
              schema:
                type: object
                required: [pipeline, report]
                properties:
                  pipeline:
                    $ref: "#/components/schemas/Pipeline"
                  report:
                    $ref: "#/components/schemas/LoadReport"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Strict load with items missing from the library; nothing changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Invalid"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
  /api/v1/pipgm/pipelines/{pipelineId}/playlist/save:
    post:
      operationId: savePipelinePlaylist
      tags: [Playlists]
      summary: Save a feed's current playlist under a name
      description: Creates a new saved playlist (201), or replaces the one named by playlistId (200).
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                playlistId:
                  type: string
      responses:
        "200":
          description: Replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedPlaylist"
        "201":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedPlaylist"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
  /api/v1/pipgm/items:
    get:
      operationId: listItems
      tags: [Items]
      summary: The library, optionally filtered by type, text and use dates
      description: >
        Without a query every item is returned. `type` is the library type (sound, tts, hymn, song, image, video, slides,
        canva or any name an item was tagged with); `types` in the answer counts the matches per type (before the type
        filter) for filter chips. `usedFrom`/`usedTo` match items whose useAt overlaps the range.
      parameters:
        - {in: query, name: type, schema: {type: string}, description: Comma-separated library types}
        - {in: query, name: kind, schema: {type: string}, description: Comma-separated kinds (audio, hymn, image, ...)}
        - {in: query, name: q, schema: {type: string}, description: Words that must all be in the title}
        - {in: query, name: usedFrom, schema: {type: string}, description: YYYY-MM-DD}
        - {in: query, name: usedTo, schema: {type: string}, description: YYYY-MM-DD}
        - {in: query, name: unscheduled, schema: {type: boolean}, description: true = only items without a useAt}
        - {in: query, name: sort, schema: {type: string, enum: [newest, oldest, title, used]}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 500}}
        - {in: query, name: offset, schema: {type: integer, minimum: 0}}
      responses:
        "200":
          description: Library items
          content:
            application/json:
              schema:
                type: object
                required: [items, total, types, standardTypes]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Item"
                  total:
                    type: integer
                    description: Matches before limit and offset
                  types:
                    type: array
                    items:
                      type: object
                      required: [type, count]
                      properties:
                        type: {type: string}
                        count: {type: integer}
                  standardTypes:
                    type: array
                    items: {type: string}
        "422":
          $ref: "#/components/responses/Invalid"
  /api/v1/pipgm/items/{itemId}:
    get:
      operationId: getItem
      tags: [Items]
      parameters:
        - in: path
          name: itemId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Library item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateItem
      tags: [Items]
      summary: Rename an item and/or set its library type (type null = the default of its kind)
      parameters:
        - in: path
          name: itemId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: {type: string}
                type: {type: string, nullable: true, description: "Lowercase letters, digits and dashes, at most 32"}
      responses:
        "200":
          description: The updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
    delete:
      operationId: deleteItem
      tags: [Items]
      summary: Remove a library item, its uploaded files (also from the library store) and its place in every playlist
      parameters:
        - in: path
          name: itemId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: The library store could not delete the files; nothing was removed from the store
  /api/v1/pipgm/library/storage:
    get:
      operationId: getLibraryStorage
      tags: [Items]
      summary: Whether the library is kept in pistorage, whether it has been loaded, and which items are not saved yet
      responses:
        "200":
          description: Storage status
          content:
            application/json:
              schema:
                type: object
                required: [enabled, loaded, stored, unsaved]
                properties:
                  enabled: { type: boolean }
                  loaded: { type: boolean }
                  stored: { type: integer }
                  unsaved:
                    type: array
                    items:
                      type: object
                      required: [itemId, error]
                      properties:
                        itemId: { type: string }
                        error: { type: [string, "null"] }
  /api/v1/pipgm/items/{itemId}/steps:
    get:
      operationId: listItemSteps
      tags: [Items]
      summary: The steps of an item and which have a prepared picture (with its URLs), plus the state of the last prepare run
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string }
        - in: query
          name: orientation
          schema: { type: string, enum: [landscape, portrait], default: landscape }
      responses:
        "200":
          description: Steps
          content:
            application/json:
              schema:
                type: object
                required: [orientation, prepare, steps]
                properties:
                  orientation: { type: string }
                  prepare:
                    type: object
                    required: [state, done, total, error]
                    properties:
                      state: { type: string, enum: [idle, running, done, failed] }
                      done: { type: integer }
                      total: { type: integer }
                      error: { type: [string, "null"] }
                  steps:
                    type: array
                    items:
                      type: object
                      required: [step, label, prepared]
                      properties:
                        step: { type: integer }
                        label: { type: string }
                        prepared: { type: boolean }
                        imageUrl: { type: string }
                        thumbnailUrl: { type: string }
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/pipgm/items/{itemId}/prepare:
    post:
      operationId: prepareItemSteps
      tags: [Items]
      summary: Render and store a picture and a thumbnail of every step that has none yet (slide, hymn, image and Canva items), in the background
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                orientation: { type: string, enum: [landscape, portrait], default: landscape }
      responses:
        "202":
          description: Started (or already running); poll listItemSteps
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Not a still item, or a bad orientation
  /api/v1/pipgm/items/{itemId}/steps/{step}/image.png:
    get:
      operationId: getStepImage
      tags: [Items]
      summary: The prepared picture of a step (404 STEP_NOT_PREPARED if there is none)
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string }
        - in: path
          name: step
          required: true
          schema: { type: integer }
        - in: query
          name: orientation
          schema: { type: string, enum: [landscape, portrait], default: landscape }
      responses:
        "200":
          description: PNG
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/pipgm/items/{itemId}/steps/{step}/thumbnail.jpg:
    get:
      operationId: getStepThumbnail
      tags: [Items]
      summary: The prepared thumbnail (320 px wide JPEG) of a step
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string }
        - in: path
          name: step
          required: true
          schema: { type: integer }
        - in: query
          name: orientation
          schema: { type: string, enum: [landscape, portrait], default: landscape }
      responses:
        "200":
          description: JPEG
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/pipgm/items/canva:
    post:
      operationId: createCanvaItem
      tags: [Items]
      summary: Create or push a Canva item (designId or a Canva design URL; optional pages and export links)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                designId: { type: string }
                title: { type: string }
                embedUrl: { type: string }
                editUrl: { type: string }
                pageCount: { type: integer }
                targetPipelineId: { type: string }
                cueImmediately: { type: boolean }
                useAt:
                  description: >-
                    When the presentation is meant to be used: a day (2026-11-08), an hour (2026-11-08T10), a moment
                    (2026-11-08T10:30) or a range (2026-11-08/2026-11-10); a list or a comma separated string holds
                    several. pistorage then has the files in the Pi cache beforehand.
                  oneOf:
                    - type: string
                    - type: array
                      items: { type: string }
      responses:
        "201":
          description: The new item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "422":
          description: No design id or URL, or an invalid useAt
  /api/v1/pipgm/items/{itemId}/use-at:
    put:
      operationId: setItemUseAt
      tags: [Items]
      summary: >-
        Set when an item is meant to be used (null clears it). The item and its files are written to the store
        again with the date. Step pictures made earlier keep no date.
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [useAt]
              properties:
                useAt:
                  oneOf:
                    - type: string
                    - type: array
                      items: { type: string }
                    - type: "null"
      responses:
        "200":
          description: The item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "404":
          description: Unknown item
        "422":
          description: Invalid useAt
  /api/v1/pipgm/items/{itemId}/canva/export-package:
    post:
      operationId: uploadCanvaExportPackage
      tags: [Items]
      summary: >-
        Deliver the exported pages of a Canva item as a zip (Content-Type application/zip) or as JSON
        {pages:[{filename, mimeType?, pageNumber?, dataBase64}]}. Answers 202 with a task at once; the work
        (unpacking, saving the pages with a retention deadline, preparing a picture and a thumbnail of each
        step) runs in the background. Poll the task.
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string }
        - in: query
          name: orientation
          description: landscape, portrait or both separated by a comma (default landscape)
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/zip:
            schema: { type: string, format: binary }
          application/json:
            schema: { type: object }
      responses:
        "202":
          description: Accepted. The Location header is the task URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageTask"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A package for this item is still being processed
        "422":
          description: Not a Canva item, or the body is not a usable package
  /api/v1/pipgm/tasks/{taskId}:
    get:
      operationId: getTask
      tags: [Items]
      summary: Progress of a package task
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageTask"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/pipgm/items/hymn:
    post:
      operationId: createHymnItem
      tags: [Items]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                hymnNumber:
                  type: string
                includeTitleSlide:
                  type: boolean
                stanzas:
                  type: array
                  items:
                    type: object
                    required: [lines]
                    properties:
                      stanzaNumber:
                        oneOf:
                          - type: string
                          - type: integer
                      lines:
                        type: array
                        items:
                          type: string
                      refrain:
                        type: boolean
                rawText:
                  type: string
                targetPipelineId:
                  $ref: "#/components/schemas/PipgmPipelineId"
                cueImmediately:
                  type: boolean
      responses:
        "201":
          description: Created hymn item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "422":
          $ref: "#/components/responses/Invalid"
  /api/v1/pipgm/items/youtube:
    post:
      operationId: createYouTubeItem
      tags: [Items]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [urlOrId]
              properties:
                title:
                  type: string
                urlOrId:
                  type: string
                startSeconds:
                  type: number
                endSeconds:
                  type: number
                autoplay:
                  type: boolean
                loop:
                  type: boolean
                targetPipelineId:
                  $ref: "#/components/schemas/PipgmPipelineId"
                cueImmediately:
                  type: boolean
      responses:
        "201":
          description: Created YouTube item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "422":
          $ref: "#/components/responses/Invalid"
  /api/v1/pipgm/library/active:
    get:
      operationId: getActiveFolder
      tags: [Library]
      summary: The active folder for a day
      description: >
        The items whose useAt covers the day (reason date) together with the items added by hand (reason manual; both
        when both apply). The day defaults to today in PIPGM_TIMEZONE.
      parameters:
        - {in: query, name: date, schema: {type: string}, description: YYYY-MM-DD}
      responses:
        "200":
          $ref: "#/components/responses/ActiveFolder"
        "422":
          $ref: "#/components/responses/Invalid"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
    delete:
      operationId: clearActiveFolder
      tags: [Library]
      summary: Remove every hand-picked item from the active folder (items chosen by date stay)
      responses:
        "200":
          description: Number removed, and the folder as it is now
        "503":
          $ref: "#/components/responses/StorageUnavailable"
  /api/v1/pipgm/library/active/{itemId}:
    put:
      operationId: addToActiveFolder
      tags: [Library]
      summary: Add an item to the active folder by hand
      parameters:
        - {in: path, name: itemId, required: true, schema: {type: string}}
      responses:
        "200":
          $ref: "#/components/responses/ActiveFolder"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The active folder is full
        "503":
          $ref: "#/components/responses/StorageUnavailable"
    delete:
      operationId: removeFromActiveFolder
      tags: [Library]
      summary: Remove a hand-picked item from the active folder
      parameters:
        - {in: path, name: itemId, required: true, schema: {type: string}}
      responses:
        "200":
          $ref: "#/components/responses/ActiveFolder"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
  /api/v1/pipgm/library/active/playlist:
    post:
      operationId: createPlaylistFromActiveFolder
      tags: [Library]
      summary: Save a playlist from the active folder
      description: >
        Sound items are left out (they play through audio/play) unless includeAudio is true; `skippedAudio` says how many.
        itemIds picks and orders a subset of the folder.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
                date: {type: string, description: YYYY-MM-DD, default today}
                orientation: {type: string, enum: [landscape, portrait]}
                itemIds: {type: array, items: {type: string}}
                includeAudio: {type: boolean}
      responses:
        "201":
          description: The saved playlist
        "422":
          $ref: "#/components/responses/Invalid"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
  /api/v1/pipgm/items/media:
    post:
      operationId: createMediaItem
      tags: [Items]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, filename]
              properties:
                kind:
                  type: string
                  enum: [video, image, audio]
                title:
                  type: string
                filename:
                  type: string
                mimeType:
                  type: string
                dataBase64:
                  type: string
                  description: File content, base64 encoded (request body limit 50 MB)
                fit:
                  type: string
                  enum: [contain, cover]
                caption:
                  type: string
                durationMs:
                  type: number
                autoplay:
                  type: boolean
                loop:
                  type: boolean
                targetPipelineId:
                  $ref: "#/components/schemas/PipgmPipelineId"
                cueImmediately:
                  type: boolean
                type:
                  type: string
                  description: Library type (sound, jingle, song, ...); default by kind
                useAt:
                  description: When the item is meant to be used (days, hours, ranges), a string or a list
                recorded:
                  type: boolean
                  description: The audio was recorded in the browser (item.audio.origin = recording)
      responses:
        "201":
          description: >
            Created media item. Audio of any format is accepted: it is converted to mp3 (a valid PCM WAV is kept) and
            its length is read; 422 AUDIO_UNREADABLE / AUDIO_TOO_LONG, 413 AUDIO_TOO_LARGE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "422":
          $ref: "#/components/responses/Invalid"
  /api/v1/pipgm/items/pptx:
    post:
      operationId: createPptxItem
      tags: [Items]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename]
              properties:
                title:
                  type: string
                filename:
                  type: string
                dataBase64:
                  type: string
                animateBulletsByDefault:
                  type: boolean
                slides:
                  type: array
                  items:
                    type: object
                    required: [title]
                    properties:
                      slideNumber:
                        type: integer
                      title:
                        type: string
                      bullets:
                        type: array
                        items:
                          type: string
                      notes:
                        type: string
                      builds:
                        type: array
                        items:
                          type: object
                targetPipelineId:
                  $ref: "#/components/schemas/PipgmPipelineId"
                cueImmediately:
                  type: boolean
      responses:
        "201":
          description: Created PPTX item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "422":
          $ref: "#/components/responses/Invalid"
  /api/v1/pipgm/assets/{assetId}:
    get:
      operationId: getAsset
      tags: [Items]
      parameters:
        - in: path
          name: assetId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Asset bytes, with the stored MIME type
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
  parameters:
    PipelineId:
      in: path
      name: pipelineId
      required: true
      schema:
        $ref: "#/components/schemas/PipgmPipelineId"
  responses:
    ActiveFolder:
      description: The active folder for a day
      content:
        application/json:
          schema:
            type: object
            required: [date, items, dateCount, manualCount]
            properties:
              date: {type: string}
              items:
                type: array
                items:
                  type: object
                  required: [item, reason]
                  properties:
                    item:
                      $ref: "#/components/schemas/Item"
                    reason:
                      type: string
                      enum: [date, manual, both]
              dateCount: {type: integer}
              manualCount: {type: integer}
    StorageUnavailable:
      description: The playlist store (pistorage) is not reachable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Invalid:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    LoadReport:
      type: object
      required: [mode, resolved, missing, duplicates, skipped, keptActiveItemId, carriedActiveItem]
      properties:
        mode:
          type: string
          enum: [replace, append]
        resolved:
          type: array
          items:
            type: object
            required: [index, itemId, by]
            properties:
              index:
                type: integer
              itemId:
                type: string
              by:
                type: string
                enum: [id, kindTitle, hymnNumber]
        missing:
          type: array
          items:
            type: object
            required: [index, itemId]
            properties:
              index:
                type: integer
              itemId:
                type: string
              kind:
                type: string
              title:
                type: string
              hymn:
                type: object
        duplicates:
          type: array
          items:
            type: object
            required: [index, itemId]
            properties:
              index:
                type: integer
              itemId:
                type: string
        skipped:
          type: array
          items:
            type: object
            required: [index, reason]
            properties:
              index:
                type: integer
              reason:
                type: string
                enum: [pause-not-supported]
        keptActiveItemId:
          type: string
          nullable: true
        carriedActiveItem:
          type: boolean
    PlaylistItem:
      type: object
      description: >
        A library item (`itemId`) or a pause marker (`pause: true`, optional `label`), never both.
        `advanceSeconds` (items only) is the time after which the feed should move on by itself.
        Pause markers and `advanceSeconds` are stored but not acted on yet; loading a playlist skips pauses.
      properties:
        itemId:
          type: string
        pause:
          type: boolean
          enum: [true]
        label:
          type: string
          maxLength: 120
        advanceSeconds:
          type: number
          maximum: 3600
        kind:
          type: string
        title:
          type: string
        hymn:
          type: object
          required: [number]
          properties:
            number:
              oneOf:
                - type: integer
                - type: string
    PlaylistInput:
      type: object
      required: [name, items]
      properties:
        schema:
          type: string
          enum: ["piprogram.playlist/1"]
        name:
          type: string
          maxLength: 120
        orientation:
          type: string
          enum: [landscape, portrait]
        items:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/PlaylistItem"
    SavedPlaylist:
      type: object
      required: [schema, id, name, savedAt, items]
      properties:
        schema:
          type: string
        id:
          type: string
        name:
          type: string
        savedAt:
          type: string
        orientation:
          type: string
          enum: [landscape, portrait]
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlaylistItem"
    PlaylistSummary:
      type: object
      required: [id, name, savedAt, itemCount]
      properties:
        id:
          type: string
        name:
          type: string
        savedAt:
          type: string
        orientation:
          type: string
          enum: [landscape, portrait]
        itemCount:
          type: integer
    PackageTask:
      type: object
      required: [taskId, type, itemId, state, progress, pages, pictures, orientations, saved, ready, error, startedAt, updatedAt]
      properties:
        taskId: { type: string }
        type: { type: string, enum: [canva-package] }
        itemId: { type: string }
        state: { type: string, enum: [queued, unpacking, preparing, ready, failed] }
        progress: { type: number, minimum: 0, maximum: 1, description: Over the whole job; never goes back. }
        pages:
          type: object
          properties:
            total: { type: integer }
        pictures:
          type: object
          description: Step pictures with their thumbnails made, over all requested orientations.
          properties:
            done: { type: integer }
            total: { type: integer }
        orientations: { type: array, items: { type: string } }
        saved: { type: boolean, description: The item and its page files are stored in the library store. Not needed for ready. }
        ready: { type: boolean, description: The item can go on air with its pictures prepared. }
        error: { type: [string, "null"] }
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PipgmPipelineId:
      type: string
      enum: [PiPGM1, PiPGM2, PiPGM3]
    Pipeline:
      type: object
      description: Pipeline snapshot; fields as returned by the service (additionalProperties allowed)
      properties:
        keyColor:
          type: string
          nullable: true
          description: Chroma key colour (#rrggbb) of the feed, null = normal background
        slideFeed:
          $ref: "#/components/schemas/SlideFeed"
      additionalProperties: true
    SlideFeed:
      type: object
      description: >
        Where the current slide can be read as a PNG, and its real size. aspect is reduced from the
        real frame size (portrait pipelines are 9:16, not the projectors' 10:16 preset).
      required: [framePath, width, height, aspect, hasSlide]
      properties:
        framePath:
          type: string
          description: Path of the frame route for this pipeline (relative to the API root)
        width:
          type: integer
        height:
          type: integer
        aspect:
          type: string
          example: "9:16"
        hasSlide:
          type: boolean
          description: True while the active item has at least one step
    Item:
      type: object
      description: Library item; fields as returned by the service
      additionalProperties: true
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
