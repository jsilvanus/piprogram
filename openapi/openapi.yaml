openapi: 3.1.0
info:
  title: PiPGM API
  version: 1.0.0
  description: PiPGM pipelines, library items and stage page, split from pimatrix. Canva routes come in 1.1.
servers:
  - url: http://127.0.0.1:3200
tags:
  - name: System
  - name: Pipelines
  - name: Items
paths:
  /health:
    get:
      operationId: getHealth
      tags: [System]
      responses:
        "200":
          description: Process is running
  /pipgm/{pipelineId}/stage:
    get:
      operationId: getStagePage
      tags: [Pipelines]
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      responses:
        "200":
          description: Stage page (HTML)
          content:
            text/html:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/pipgm/pipelines:
    get:
      operationId: listPipelines
      tags: [Pipelines]
      parameters:
        - in: query
          name: includeHidden
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: All pipelines
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Pipeline"
  /api/v1/pipgm/pipelines/{pipelineId}:
    get:
      operationId: getPipeline
      tags: [Pipelines]
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      responses:
        "200":
          description: Pipeline snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pipeline"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/pipgm/pipelines/{pipelineId}/frame.png:
    get:
      operationId: getPipelineFrame
      tags: [Pipelines]
      description: >
        The current stage of the pipeline as a PNG, rendered by a headless browser from the stage page.
        Size defaults to the pipeline resolution (1080x1920 portrait, 1920x1080 landscape). With alpha=1
        the stage background is left out, so the picture keeps alpha (text and media stay opaque).
        A fade to black is not applied here: read fadeToBlack from the pipeline. Reads stay open.
      parameters:
        - $ref: "#/components/parameters/PipelineId"
        - in: query
          name: width
          required: false
          schema:
            type: integer
            minimum: 16
            maximum: 3840
        - in: query
          name: height
          required: false
          schema:
            type: integer
            minimum: 16
            maximum: 3840
        - in: query
          name: alpha
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The stage as a PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
        "503":
          description: No browser for the frame route (set PIPGM_CHROMIUM)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The browser failed to render the frame
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/pipgm/pipelines/{pipelineId}/config:
    put:
      operationId: updatePipelineConfig
      tags: [Pipelines]
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orientation:
                  type: string
                  enum: [landscape, portrait]
                hidden:
                  type: boolean
                linked:
                  type: boolean
                fadeDurationMs:
                  type: number
                  minimum: 0
                  maximum: 10000
      responses:
        "200":
          description: Updated pipeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pipeline"
        "422":
          $ref: "#/components/responses/Invalid"
  /api/v1/pipgm/pipelines/{pipelineId}/control:
    post:
      operationId: controlPipeline
      tags: [Pipelines]
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [next, prev, gotoStep, gotoItem, play, pause, stop, restart]
                stepIndex:
                  type: integer
                  minimum: 0
                itemId:
                  type: string
                itemIndex:
                  type: integer
                  minimum: 0
                advanceItemOnEnd:
                  type: boolean
                sync:
                  type: boolean
      responses:
        "200":
          description: Pipeline after the action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pipeline"
        "422":
          $ref: "#/components/responses/Invalid"
  /api/v1/pipgm/pipelines/{pipelineId}/ftb:
    post:
      operationId: setFadeToBlack
      tags: [Pipelines]
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fadeToBlack:
                  type: boolean
                toggle:
                  type: boolean
                durationMs:
                  type: number
                  minimum: 0
                  maximum: 10000
                sync:
                  type: boolean
      responses:
        "200":
          description: Pipeline after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pipeline"
  /api/v1/pipgm/pipelines/{pipelineId}/audio:
    post:
      operationId: setPipelineAudio
      tags: [Pipelines]
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                audioEnabled:
                  type: boolean
                toggle:
                  type: boolean
                volume:
                  type: number
                  minimum: 0
                  maximum: 100
                  description: Requested volume; the stage plays at most maxVolume (PIPGM_AUDIO_MAX_VOLUME)
                armSeconds:
                  type: number
                  minimum: 1
                  maximum: 3600
                  description: >
                    How long sound stays armed when audioEnabled turns on or toggles on
                    (default PIPGM_AUDIO_ARM_SECONDS, 900). When it ends, sound is disarmed and the track stops.
                sync:
                  type: boolean
      responses:
        "200":
          description: Pipeline after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pipeline"
  /api/v1/pipgm/pipelines/{pipelineId}/audio/play:
    post:
      operationId: playPipelineAudio
      tags: [Pipelines]
      description: Play an audio library item as the feed's audio content (separate from its visual). Needs sound armed.
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId]
              properties:
                itemId:
                  type: string
                loop:
                  type: boolean
                volume:
                  type: number
                  minimum: 0
                  maximum: 100
      responses:
        "200":
          description: Pipeline after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pipeline"
        "404":
          description: Unknown pipeline or item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Sound is not armed (error code AUDIO_NOT_ARMED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Invalid"
  /api/v1/pipgm/pipelines/{pipelineId}/audio/stop:
    post:
      operationId: stopPipelineAudio
      tags: [Pipelines]
      description: Stop the feed's audio track. The feed stays armed.
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      responses:
        "200":
          description: Pipeline after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pipeline"
  /api/v1/pipgm/feeders:
    get:
      operationId: getFeeders
      tags: [Pipelines]
      description: >
        State of the feed publishers. When PIPGM_PUBLISH_RTSP_BASE is set, piprogram itself publishes PiPGM1-3 to
        MediaMTX (one long-running ffmpeg per feed, stream name = pipeline id) and swaps pictures without restarting it.
        `enabled` is false when publishing is off.
      responses:
        "200":
          description: Publisher state per feed
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
                  feeds:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        running:
                          type: boolean
                        width:
                          type: integer
                          nullable: true
                        height:
                          type: integer
                          nullable: true
                        restarts:
                          type: integer
                        lastError:
                          type: string
                          nullable: true
  /api/v1/pipgm/audio/kill:
    post:
      operationId: killAudio
      tags: [Pipelines]
      description: >
        Kill switch. On every pipeline: stop the audio track, disarm and mute (video items go silent too).
        Needs the API key like any write.
      responses:
        "200":
          description: All pipelines after the kill
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Pipeline"
  /api/v1/pipgm/tts/prepare:
    post:
      operationId: prepareSpeech
      tags: [Items]
      description: >
        Render a phrase to a WAV ahead of time and keep it as an audio library item; play it later with
        audio/play. The same text and voice return the same item (200, cached) without rendering again.
        Limits: PIPGM_TTS_MAX_CHARS (500), PIPGM_TTS_MAX_SECONDS (60), PIPGM_AUDIO_MAX_BYTES (20 MB), and the
        oldest prepared phrases are dropped beyond PIPGM_TTS_MAX_ITEMS (50) / PIPGM_TTS_MAX_TOTAL_BYTES (100 MB).
        Phrases are cached on disk (PIPGM_CACHE_DIR) and survive restarts. One render runs at a time. 503 TTS_NOT_CONFIGURED until Piper is set up (PIPGM_TTS_MODEL_DIR).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                voice:
                  type: string
                  description: Voice name, a model file in PIPGM_TTS_MODEL_DIR without extension (default PIPGM_TTS_VOICE)
                title:
                  type: string
      responses:
        "200":
          description: Already prepared
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    $ref: "#/components/schemas/Item"
                  cached:
                    type: boolean
        "201":
          description: Prepared now
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    $ref: "#/components/schemas/Item"
                  cached:
                    type: boolean
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          description: Too many phrases waiting (TTS_BUSY)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The engine failed or returned no usable WAV (TTS_FAILED, TTS_BAD_AUDIO)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Text to speech is not set up (TTS_NOT_CONFIGURED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/pipgm/pipelines/{pipelineId}/basic-image:
    put:
      operationId: setPipelineBasicImage
      tags: [Pipelines]
      description: Choose an image library item to show when nothing else is active (null clears it; the default is black).
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId]
              properties:
                itemId:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Pipeline after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pipeline"
        "404":
          description: Unknown pipeline or item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Invalid"
  /api/v1/pipgm/pipelines/{pipelineId}/playlist:
    post:
      operationId: addPlaylistItem
      tags: [Pipelines]
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId]
              properties:
                itemId:
                  type: string
                cueImmediately:
                  type: boolean
      responses:
        "200":
          description: Pipeline with the item added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pipeline"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/pipgm/pipelines/{pipelineId}/playlist/{itemId}:
    delete:
      operationId: removePlaylistItem
      tags: [Pipelines]
      parameters:
        - $ref: "#/components/parameters/PipelineId"
        - in: path
          name: itemId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pipeline with the item removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pipeline"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/pipgm/items:
    get:
      operationId: listItems
      tags: [Items]
      responses:
        "200":
          description: Library items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Item"
  /api/v1/pipgm/items/{itemId}:
    get:
      operationId: getItem
      tags: [Items]
      parameters:
        - in: path
          name: itemId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Library item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteItem
      tags: [Items]
      summary: Remove a library item, its uploaded files (also from the library store) and its place in every playlist
      parameters:
        - in: path
          name: itemId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: The library store could not delete the files; nothing was removed from the store
  /api/v1/pipgm/library/storage:
    get:
      operationId: getLibraryStorage
      tags: [Items]
      summary: Whether the library is kept in pistorage, whether it has been loaded, and which items are not saved yet
      responses:
        "200":
          description: Storage status
          content:
            application/json:
              schema:
                type: object
                required: [enabled, loaded, stored, unsaved]
                properties:
                  enabled: { type: boolean }
                  loaded: { type: boolean }
                  stored: { type: integer }
                  unsaved:
                    type: array
                    items:
                      type: object
                      required: [itemId, error]
                      properties:
                        itemId: { type: string }
                        error: { type: [string, "null"] }
  /api/v1/pipgm/items/{itemId}/steps:
    get:
      operationId: listItemSteps
      tags: [Items]
      summary: The steps of an item and which have a prepared picture (with its URLs), plus the state of the last prepare run
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string }
        - in: query
          name: orientation
          schema: { type: string, enum: [landscape, portrait], default: landscape }
      responses:
        "200":
          description: Steps
          content:
            application/json:
              schema:
                type: object
                required: [orientation, prepare, steps]
                properties:
                  orientation: { type: string }
                  prepare:
                    type: object
                    required: [state, done, total, error]
                    properties:
                      state: { type: string, enum: [idle, running, done, failed] }
                      done: { type: integer }
                      total: { type: integer }
                      error: { type: [string, "null"] }
                  steps:
                    type: array
                    items:
                      type: object
                      required: [step, label, prepared]
                      properties:
                        step: { type: integer }
                        label: { type: string }
                        prepared: { type: boolean }
                        imageUrl: { type: string }
                        thumbnailUrl: { type: string }
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/pipgm/items/{itemId}/prepare:
    post:
      operationId: prepareItemSteps
      tags: [Items]
      summary: Render and store a picture and a thumbnail of every step that has none yet (slide, hymn, image and Canva items), in the background
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                orientation: { type: string, enum: [landscape, portrait], default: landscape }
      responses:
        "202":
          description: Started (or already running); poll listItemSteps
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Not a still item, or a bad orientation
  /api/v1/pipgm/items/{itemId}/steps/{step}/image.png:
    get:
      operationId: getStepImage
      tags: [Items]
      summary: The prepared picture of a step (404 STEP_NOT_PREPARED if there is none)
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string }
        - in: path
          name: step
          required: true
          schema: { type: integer }
        - in: query
          name: orientation
          schema: { type: string, enum: [landscape, portrait], default: landscape }
      responses:
        "200":
          description: PNG
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/pipgm/items/{itemId}/steps/{step}/thumbnail.jpg:
    get:
      operationId: getStepThumbnail
      tags: [Items]
      summary: The prepared thumbnail (320 px wide JPEG) of a step
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string }
        - in: path
          name: step
          required: true
          schema: { type: integer }
        - in: query
          name: orientation
          schema: { type: string, enum: [landscape, portrait], default: landscape }
      responses:
        "200":
          description: JPEG
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/pipgm/items/canva:
    post:
      operationId: createCanvaItem
      tags: [Items]
      summary: Create or push a Canva item (designId or a Canva design URL; optional pages and export links)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                designId: { type: string }
                title: { type: string }
                embedUrl: { type: string }
                editUrl: { type: string }
                pageCount: { type: integer }
                targetPipelineId: { type: string }
                cueImmediately: { type: boolean }
      responses:
        "201":
          description: The new item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "422":
          description: No design id or URL
  /api/v1/pipgm/items/{itemId}/canva/export-package:
    post:
      operationId: uploadCanvaExportPackage
      tags: [Items]
      summary: >-
        Deliver the exported pages of a Canva item as a zip (Content-Type application/zip) or as JSON
        {pages:[{filename, mimeType?, pageNumber?, dataBase64}]}. Answers 202 with a task at once; the work
        (unpacking, saving the pages with a retention deadline, preparing a picture and a thumbnail of each
        step) runs in the background. Poll the task.
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string }
        - in: query
          name: orientation
          description: landscape, portrait or both separated by a comma (default landscape)
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/zip:
            schema: { type: string, format: binary }
          application/json:
            schema: { type: object }
      responses:
        "202":
          description: Accepted. The Location header is the task URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageTask"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A package for this item is still being processed
        "422":
          description: Not a Canva item, or the body is not a usable package
  /api/v1/pipgm/tasks/{taskId}:
    get:
      operationId: getTask
      tags: [Items]
      summary: Progress of a package task
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackageTask"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/pipgm/items/hymn:
    post:
      operationId: createHymnItem
      tags: [Items]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                hymnNumber:
                  type: string
                includeTitleSlide:
                  type: boolean
                stanzas:
                  type: array
                  items:
                    type: object
                    required: [lines]
                    properties:
                      stanzaNumber:
                        oneOf:
                          - type: string
                          - type: integer
                      lines:
                        type: array
                        items:
                          type: string
                      refrain:
                        type: boolean
                rawText:
                  type: string
                targetPipelineId:
                  $ref: "#/components/schemas/PipgmPipelineId"
                cueImmediately:
                  type: boolean
      responses:
        "201":
          description: Created hymn item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "422":
          $ref: "#/components/responses/Invalid"
  /api/v1/pipgm/items/youtube:
    post:
      operationId: createYouTubeItem
      tags: [Items]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [urlOrId]
              properties:
                title:
                  type: string
                urlOrId:
                  type: string
                startSeconds:
                  type: number
                endSeconds:
                  type: number
                autoplay:
                  type: boolean
                loop:
                  type: boolean
                targetPipelineId:
                  $ref: "#/components/schemas/PipgmPipelineId"
                cueImmediately:
                  type: boolean
      responses:
        "201":
          description: Created YouTube item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "422":
          $ref: "#/components/responses/Invalid"
  /api/v1/pipgm/items/media:
    post:
      operationId: createMediaItem
      tags: [Items]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, filename]
              properties:
                kind:
                  type: string
                  enum: [video, image, audio]
                title:
                  type: string
                filename:
                  type: string
                mimeType:
                  type: string
                dataBase64:
                  type: string
                  description: File content, base64 encoded (request body limit 50 MB)
                fit:
                  type: string
                  enum: [contain, cover]
                caption:
                  type: string
                durationMs:
                  type: number
                autoplay:
                  type: boolean
                loop:
                  type: boolean
                targetPipelineId:
                  $ref: "#/components/schemas/PipgmPipelineId"
                cueImmediately:
                  type: boolean
      responses:
        "201":
          description: Created media item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "422":
          $ref: "#/components/responses/Invalid"
  /api/v1/pipgm/items/pptx:
    post:
      operationId: createPptxItem
      tags: [Items]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename]
              properties:
                title:
                  type: string
                filename:
                  type: string
                dataBase64:
                  type: string
                animateBulletsByDefault:
                  type: boolean
                slides:
                  type: array
                  items:
                    type: object
                    required: [title]
                    properties:
                      slideNumber:
                        type: integer
                      title:
                        type: string
                      bullets:
                        type: array
                        items:
                          type: string
                      notes:
                        type: string
                      builds:
                        type: array
                        items:
                          type: object
                targetPipelineId:
                  $ref: "#/components/schemas/PipgmPipelineId"
                cueImmediately:
                  type: boolean
      responses:
        "201":
          description: Created PPTX item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "422":
          $ref: "#/components/responses/Invalid"
  /api/v1/pipgm/assets/{assetId}:
    get:
      operationId: getAsset
      tags: [Items]
      parameters:
        - in: path
          name: assetId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Asset bytes, with the stored MIME type
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
  parameters:
    PipelineId:
      in: path
      name: pipelineId
      required: true
      schema:
        $ref: "#/components/schemas/PipgmPipelineId"
  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Invalid:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    PackageTask:
      type: object
      required: [taskId, type, itemId, state, progress, pages, pictures, orientations, saved, ready, error, startedAt, updatedAt]
      properties:
        taskId: { type: string }
        type: { type: string, enum: [canva-package] }
        itemId: { type: string }
        state: { type: string, enum: [queued, unpacking, preparing, ready, failed] }
        progress: { type: number, minimum: 0, maximum: 1, description: Over the whole job; never goes back. }
        pages:
          type: object
          properties:
            total: { type: integer }
        pictures:
          type: object
          description: Step pictures with their thumbnails made, over all requested orientations.
          properties:
            done: { type: integer }
            total: { type: integer }
        orientations: { type: array, items: { type: string } }
        saved: { type: boolean, description: The item and its page files are stored in the library store. Not needed for ready. }
        ready: { type: boolean, description: The item can go on air with its pictures prepared. }
        error: { type: [string, "null"] }
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PipgmPipelineId:
      type: string
      enum: [PiPGM1, PiPGM2, PiPGM3]
    Pipeline:
      type: object
      description: Pipeline snapshot; fields as returned by the service (additionalProperties allowed)
      properties:
        slideFeed:
          $ref: "#/components/schemas/SlideFeed"
      additionalProperties: true
    SlideFeed:
      type: object
      description: >
        Where the current slide can be read as a PNG, and its real size. aspect is reduced from the
        real frame size (portrait pipelines are 9:16, not the projectors' 10:16 preset).
      required: [framePath, width, height, aspect, hasSlide]
      properties:
        framePath:
          type: string
          description: Path of the frame route for this pipeline (relative to the API root)
        width:
          type: integer
        height:
          type: integer
        aspect:
          type: string
          example: "9:16"
        hasSlide:
          type: boolean
          description: True while the active item has at least one step
    Item:
      type: object
      description: Library item; fields as returned by the service
      additionalProperties: true
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
